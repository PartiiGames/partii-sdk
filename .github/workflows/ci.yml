name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude partii-webrtc --exclude partii-rtc --exclude partii-rtc-sctp --exclude partii-rtc-datachannel
      - run: cargo test
        working-directory: examples/echo-server
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: examples/echo-server
